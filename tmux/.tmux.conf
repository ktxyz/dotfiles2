# ~/.tmux.conf — Nord palette to match the prompt

# Terminal & responsiveness
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -sg escape-time 10
set -g history-limit 100000
set -g mouse on

# saner window/pane numbering
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# vi-style copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# Status bar: Nord palette (#2e3440 #3b4252 #434c5e #4c566a #88c0d0 #e5e9f0)
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#3b4252,fg=#e5e9f0"

set -g status-left-length 50
set -g status-left "#[fg=#2e3440,bg=#88c0d0,bold]  #S #[fg=#88c0d0,bg=#3b4252] #[fg=#88c0d0]#I:#P  "

set -g status-right-length 60
set -g status-right "#[fg=#4c566a]%H:%M #[fg=#4c566a,bg=#2e3440] "

# Window entries
setw -g window-status-format "#[fg=#4c566a] #I #W "
setw -g window-status-current-format "#[fg=#2e3440,bg=#88c0d0,bold] #I #W #[]"
setw -g window-status-separator ""
